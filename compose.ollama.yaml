services:
  frontdesk:
    environment:
      FRONTDESK_WEB_PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      ollama-model:
        condition: service_completed_successfully

  ollama:
    image: "${FRONTDESK_OLLAMA_IMAGE:-ollama/ollama:latest}"
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-model:
    image: "${FRONTDESK_OLLAMA_IMAGE:-ollama/ollama:latest}"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama-data:
