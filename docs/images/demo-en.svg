<text x="500.0" y="23" text-anchor="middle" font-size="12" fill="#8b949e">frontdesk — order lookup</text>
<text x="22" y="72" font-size="14" fill="#e6edf3" font-weight="400" xml:space="preserve">$ frontdesk --persona ecommerce</text>
<text x="22" y="94" font-size="14" fill="#c9d1d9" font-weight="400" xml:space="preserve"></text>
<text x="22" y="116" font-size="14" fill="#6e7681" font-weight="400" xml:space="preserve">— anthropic / claude-opus-5 / effort=medium / tools=10 / persona=ecommerce</text>
<text x="22" y="138" font-size="14" fill="#6e7681" font-weight="400" xml:space="preserve">— /help for commands, /exit to quit</text>
<text x="22" y="160" font-size="14" fill="#c9d1d9" font-weight="400" xml:space="preserve"></text>
<text x="22" y="182" font-size="14" fill="#4ec9d9" font-weight="700" xml:space="preserve">You&gt; Where is order A-88001?</text>
<text x="22" y="204" font-size="14" fill="#8b949e" font-weight="400" xml:space="preserve">  [tool] get_order_status({"order_id": "A-88001"})</text>
<text x="22" y="226" font-size="14" fill="#8b949e" font-weight="400" xml:space="preserve">  [result] {"order_id": "A-88001", "customer": "Emily Carter", "email": "emily.carter@example.com", "item": "No…</text>
<text x="22" y="248" font-size="14" fill="#c9d1d9" font-weight="400" xml:space="preserve"></text>
<text x="22" y="270" font-size="14" fill="#5ed97a" font-weight="700" xml:space="preserve">Bot&gt; Your headphones are in transit, arriving 08/21/2026.</text>
