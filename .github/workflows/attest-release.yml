name: attest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to reproduce and attest
        required: true
        default: v1.7.0
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reproduce the release ZIP
        run: python build_release.py --output dist --tests-passed 282 --allow-unsigned

      - name: Verify the generated checksum
        run: cd dist && sha256sum --check *.zip.sha256

      - name: Sign the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Publish the attested release set
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          zip_path="$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)"
          cp "$BUNDLE_PATH" "${zip_path}.sigstore.json"
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.zip \
            dist/*.zip.sha256 \
            dist/*.zip.manifest.json \
            dist/*.zip.sigstore.json

      - name: Show verification command
        run: |
          zip_name="$(basename "$(find dist -maxdepth 1 -type f -name '*.zip' -print -quit)")"
          echo 'Verify after downloading the ZIP:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh attestation verify $zip_name -R $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Attestation: ${{ steps.attest.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"
