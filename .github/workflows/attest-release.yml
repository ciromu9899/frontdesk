name: attest release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag to reproduce and attest
        required: true
        default: v1.7.0
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Reproduce the release ZIP
        run: python build_release.py --output dist --tests-passed 282 --allow-unsigned

      - name: Download the published checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-checksum
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip.sha256' \
            --dir release-checksum

      - name: Match the published release exactly
        run: cd dist && sha256sum --check ../release-checksum/*.zip.sha256

      - name: Sign the build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Show verification command
        run: |
          echo 'Verify after downloading the ZIP:' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh attestation verify frontdesk-complete-1.7.0-2026-09-05.zip -R $GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Attestation: ${{ steps.attest.outputs.attestation-url }}" >> "$GITHUB_STEP_SUMMARY"
