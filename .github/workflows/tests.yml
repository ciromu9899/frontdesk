name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package and runtime dependencies
        run: python -m pip install .

      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          FRONTDESK_AUTH_MODE: disabled

      - name: Build the package
        run: |
          python -m pip install --upgrade build
          python -m build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that no credential is committed
        run: python tools_check_secrets.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every documentation link resolves
        run: python tools_check_links.py
      # The prompt the model reads is English. Mixing languages into it makes
      # the reply language drift, and it is easy to do by accident.
      - name: Check that the shipped surface is English
        run: python tools_check_language.py
